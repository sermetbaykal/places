<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0">
<title>Neyeriz</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D0D0D;--cream:#F5F0E8;--gold:#C9A84C;--muted:#888070;--border:rgba(0,0,0,0.09)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:"DM Sans",sans-serif;background:var(--cream);color:var(--ink)}
.hero{background:var(--ink);padding:14px 16px;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 100% 80% at 80% 50%,rgba(201,168,76,0.1) 0%,transparent 70%);pointer-events:none}
.hi{max-width:960px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;position:relative}
.htag{font-size:9px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);display:block;margin-bottom:3px}
.htitle{font-family:"Playfair Display",serif;font-size:clamp(18px,3.5vw,28px);font-weight:700;color:#fff;line-height:1.1}
.htitle em{font-style:italic;color:var(--gold)}
.hstats{display:flex;gap:14px;flex-shrink:0}
.hst{display:flex;flex-direction:column;align-items:center}
.hnum{font-size:17px;font-weight:700;color:var(--gold);line-height:1}
.hlbl{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(255,255,255,0.3);margin-top:1px}
.sticky{position:sticky;top:0;z-index:100;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.08)}
.filters{padding:8px 16px;border-bottom:1px solid var(--border)}
.fi{max-width:960px;margin:0 auto;display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fl{font-size:9px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.fsel{padding:6px 22px 6px 8px;font-size:12px;font-family:"DM Sans",sans-serif;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);color:var(--ink);cursor:pointer;appearance:none;font-weight:500}
.fsel:focus{outline:none;border-color:var(--gold)}
.sw{flex:1;min-width:130px;display:flex;flex-direction:column;gap:3px}
.sinp{width:100%;padding:6px 8px;font-size:12px;font-family:"DM Sans",sans-serif;border:1.5px solid var(--border);border-radius:8px;background:var(--cream);color:var(--ink)}
.sinp:focus{outline:none;border-color:var(--gold)}
.bc{padding:6px 12px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:8px;cursor:pointer;background:var(--ink);color:var(--gold);align-self:flex-end;white-space:nowrap}
.bc:hover{background:var(--gold);color:var(--ink)}
.cw{padding:7px 16px;border-bottom:1px solid var(--border);overflow-x:auto}
.ci-wrap{max-width:960px;margin:0 auto}
.ci{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:2px 0}
.chip{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px solid transparent;cursor:pointer}
.chip.off{background:#F0EDE8!important;color:#BBB!important;border-color:#E0DBD4!important;text-decoration:line-through}
.ca{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;border:1.5px dashed #CCC;cursor:pointer;background:#fff;color:#999}
.sb{padding:8px 16px;background:var(--cream);border-bottom:1px solid var(--border)}
.sbi{max-width:960px;margin:0 auto;display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.sn{font-size:16px;font-weight:700}
.sl{font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted)}
.to{max-width:960px;margin:0 auto;padding:12px 16px 48px;display:flex;flex-direction:column;gap:10px}
.mcard{background:#fff;border-radius:12px;border:1px solid var(--border);overflow:hidden}
.mcard-top{padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.mcard-left{flex:1;min-width:0}
.mcard-name{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:3px}
.mcard-meta{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.mcard-cat{padding:2px 7px;border-radius:4px;font-size:9px;font-weight:700}
.mcard-addr{font-size:10px;color:#AAA;margin-bottom:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcard-badges{display:flex;flex-wrap:wrap;gap:4px}
.bdg{padding:3px 7px;border-radius:5px;font-size:9px;font-weight:600;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.bdg-pos{background:#E4F5EE;color:#0A5838}
.bdg-neg{background:#FDECEA;color:#8B2010}
.mcard-right{text-align:right;flex-shrink:0}
.mcard-rat{font-size:20px;font-weight:800;line-height:1}
.mcard-rev{font-size:10px;color:var(--muted);margin-top:2px}
.mcard-mapbtn{display:inline-block;margin-top:6px;padding:4px 9px;border-radius:6px;font-size:10px;font-weight:600;background:var(--cream);color:var(--ink);border:1px solid var(--border);text-decoration:none;white-space:nowrap}
.mcard-mapbtn:hover{background:var(--gold);color:#fff}
.em{padding:56px 24px;text-align:center;color:var(--muted);font-size:14px;background:#fff;border-radius:12px}
@media(max-width:480px){.htitle{font-size:18px}.hnum{font-size:15px}}
footer{background:var(--ink);color:rgba(255,255,255,0.35);text-align:center;padding:16px;font-size:11px;letter-spacing:1px}
footer strong{color:var(--gold)}
footer a{color:var(--gold);text-decoration:none;margin-left:12px}
</style>
</head>
<body>
<div class="hero"><div class="hi"><div><span class="htag">Dunya Bir Mutfak</span><h1 class="htitle">Biz Yorumlari Okuduk,<br><em>Siz Keyfini Surun.</em></h1></div><div class="hstats"><div class="hst"><span class="hnum" id="hn">-</span><span class="hlbl">Mekan</span></div><div class="hst"><span class="hnum" id="hc">-</span><span class="hlbl">Sehir</span></div><div class="hst"><span class="hnum">20+</span><span class="hlbl">Kategori</span></div></div></div></div>
<div class="sticky"><div class="filters"><div class="fi"><div class="fg"><span class="fl">Sehir</span><select class="fsel" id="fc"><option value="">Tumu</option></select></div><div class="fg"><span class="fl">Ulke</span><select class="fsel" id="fco"><option value="">Tumu</option></select></div><div class="fg"><span class="fl">Min. Puan</span><select class="fsel" id="fr"><option value="4.5">4.5+</option><option value="4.6">4.6+</option><option value="4.7">4.7+</option><option value="4.8">4.8+</option></select></div><div class="fg"><span class="fl">Min. Yorum</span><select class="fsel" id="fv"><option value="300">300+</option><option value="500">500+</option><option value="1000">1K+</option><option value="5000">5K+</option></select></div><div class="sw"><span class="fl">Arama</span><input type="text" class="sinp" id="fs2" placeholder="Mekan, sehir..."></div><button class="bc" id="bcsv">CSV</button></div></div><div class="cw"><div class="ci-wrap"><div class="ci" id="chips"></div></div></div></div>
<div class="sb"><div class="sbi"><div><span class="sn" id="s1">-</span> <span class="sl">gosterilen</span></div><div><span class="sn" id="s2">-</span> <span class="sl">sehir</span></div><div><span class="sn" id="s3">-</span> <span class="sl">ort. puan</span></div></div></div>
<div class="to" id="cards"></div>
<footer><strong>Neyeriz</strong> &nbsp;.&nbsp; Dunyanin en iyi mekanlari &nbsp;.&nbsp; 2025<a href="/admin.html">Admin</a></footer>
<script>
var CATS=[{k:"hamburger",l:"Hamburger",bg:"#FEF3DC",fg:"#7A4A08",bd:"#F0C860"},{k:"steakhouse",l:"Steakhouse",bg:"#FDECEA",fg:"#8B2010",bd:"#F09080"},{k:"italian",l:"Italyan",bg:"#FFF0ED",fg:"#8B3010",bd:"#F0A888"},{k:"desserts",l:"Tatli",bg:"#FDE8F4",fg:"#881A50",bd:"#F080C0"},{k:"coffee",l:"Kahve",bg:"#EDE5D8",fg:"#5C3A1E",bd:"#C4A070"},{k:"seafood",l:"Deniz",bg:"#E4F2FD",fg:"#0A4A88",bd:"#70B8F0"},{k:"cocktail",l:"Kokteyl",bg:"#EEE8FD",fg:"#3A2888",bd:"#9880EE"},{k:"nightclub",l:"Gece",bg:"#E8E4F8",fg:"#281E68",bd:"#8870D8"},{k:"traditional",l:"Geleneksel",bg:"#E4F5EE",fg:"#0A5838",bd:"#58C890"},{k:"pizza",l:"Pizza",bg:"#FDECEA",fg:"#7A2010",bd:"#E07858"},{k:"kebap",l:"Kebap",bg:"#FEF0E0",fg:"#8B4000",bd:"#F0A040"},{k:"manti",l:"Manti",bg:"#FDF0E8",fg:"#7A3010",bd:"#E89060"},{k:"pide",l:"Pide",bg:"#FEF5E0",fg:"#806000",bd:"#E8C040"},{k:"balik",l:"Balik",bg:"#E8F4FE",fg:"#004888",bd:"#60A8F0"},{k:"brunch",l:"Brunch",bg:"#F0F8E8",fg:"#2A5810",bd:"#80C850"},{k:"sushi",l:"Sushi",bg:"#FEE8E8",fg:"#880018",bd:"#F06070"},{k:"vegan",l:"Vegan",bg:"#E8F5E0",fg:"#1A5800",bd:"#60B840"},{k:"fastfood",l:"Fast Food",bg:"#FEF0DC",fg:"#884000",bd:"#F0A060"},{k:"fine",l:"Fine Dining",bg:"#F0E8FE",fg:"#380888",bd:"#9060F0"},{k:"bar",l:"Bar",bg:"#E8E0F8",fg:"#281870",bd:"#7060D8"}];
var ALL=[],BADGES={},ac={},sc="rat",sd=-1;
CATS.forEach(function(c){ac[c.k]=true;});
function ci(k){for(var i=0;i<CATS.length;i++){if(CATS[i].k===k)return CATS[i];}return{k:k,l:k,bg:"#EEE",fg:"#333",bd:"#CCC"};}
function buildChips(){var el=document.getElementById("chips"),h="";CATS.forEach(function(c){h+='<span class="chip" data-k="'+c.k+'" style="background:'+c.bg+';color:'+c.fg+';border-color:'+c.bd+'">'+c.l+'</span>';});h+='<span class="ca" id="ca">Tumu</span>';el.innerHTML=h;el.querySelectorAll("[data-k]").forEach(function(s){s.addEventListener("click",function(){var k=s.getAttribute("data-k"),c=ci(k);ac[k]=!ac[k];if(ac[k]){s.classList.remove("off");s.style.background=c.bg;s.style.color=c.fg;s.style.borderColor=c.bd;}else s.classList.add("off");render();});});document.getElementById("ca").addEventListener("click",function(){var all=CATS.every(function(c){return ac[c.k];});CATS.forEach(function(c){ac[c.k]=!all;});el.querySelectorAll("[data-k]").forEach(function(s){var k=s.getAttribute("data-k"),c=ci(k);if(ac[k]){s.classList.remove("off");s.style.background=c.bg;s.style.color=c.fg;s.style.borderColor=c.bd;}else s.classList.add("off");});render();});}
function buildSelects(){var cities=[],countries=[];ALL.forEach(function(r){if(cities.indexOf(r.city)<0)cities.push(r.city);if(countries.indexOf(r.country)<0)countries.push(r.country);});cities.sort();countries.sort();var fc=document.getElementById("fc"),fco=document.getElementById("fco");fc.innerHTML='<option value="">Tumu</option>';fco.innerHTML='<option value="">Tumu</option>';cities.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;fc.appendChild(o);});countries.forEach(function(c){var o=document.createElement("option");o.value=c;o.textContent=c;fco.appendChild(o);});}
function gf(){var city=document.getElementById("fc").value,country=document.getElementById("fco").value,mr=parseFloat(document.getElementById("fr").value),mv=parseInt(document.getElementById("fv").value),s=document.getElementById("fs2").value.toLowerCase().trim();return ALL.filter(function(r){if(!ac[r.cat])return false;if(city&&r.city!==city)return false;if(country&&r.country!==country)return false;if(r.rat<mr||r.rev<mv)return false;if(s){var h=(r.name+" "+r.city+" "+r.addr+" "+r.country).toLowerCase();if(h.indexOf(s)<0)return false;}return true;});}
function rc(v){if(v>=4.8)return"#1A7A2E";if(v>=4.7)return"#2E8B2E";if(v>=4.6)return"#C47A00";return"#A06000";}
function render(){var fd=gf();fd.sort(function(a,b){var av=a[sc],bv=b[sc];if(typeof av==="string"){av=av.toLowerCase();bv=bv.toLowerCase();}return sd*(av>bv?1:av<bv?-1:0);});var el=document.getElementById("cards");if(!fd.length){el.innerHTML='<div class="em">Mekan bulunamadi</div>';return;}var html="";fd.forEach(function(r){var c=ci(r.cat),col=rc(r.rat),mu="https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(r.name+" "+r.city)+"&query_place_id="+r.place_id,bdg=BADGES[r.place_id]||{positive:[],negative:[]},bh="";(bdg.positive||[]).forEach(function(b){bh+='<span class="bdg bdg-pos">+ '+b+'</span>';});(bdg.negative||[]).forEach(function(b){bh+='<span class="bdg bdg-neg">! '+b+'</span>';});html+='<div class="mcard"><div class="mcard-top"><div class="mcard-left"><div class="mcard-name">'+r.name+'</div><div class="mcard-meta">'+r.flag+' '+r.city+', '+r.country+' &nbsp;.&nbsp; <span class="mcard-cat" style="background:'+c.bg+';color:'+c.fg+'">'+c.l+'</span></div><div class="mcard-addr">'+r.addr+'</div>'+(bh?'<div class="mcard-badges">'+bh+'</div>':'')+' </div><div class="mcard-right"><div class="mcard-rat" style="color:'+col+'">'+r.rat.toFixed(1)+'<span style="font-size:12px">*</span></div><div class="mcard-rev">'+r.rev.toLocaleString("tr-TR")+'</div><a class="mcard-mapbtn" href="'+mu+'" target="_blank">Harita</a></div></div></div>';});el.innerHTML=html;var avg=fd.length?fd.reduce(function(s,r){return s+r.rat;},0)/fd.length:0;document.getElementById("s1").textContent=fd.length.toLocaleString("tr-TR");document.getElementById("s2").textContent=new Set(fd.map(function(r){return r.city;})).size;document.getElementById("s3").textContent=fd.length?avg.toFixed(2):"-";document.getElementById("hn").textContent=ALL.length;document.getElementById("hc").textContent=new Set(ALL.map(function(r){return r.city;})).size;}
["fc","fco","fr","fv"].forEach(function(id){document.getElementById(id).addEventListener("change",render);});
document.getElementById("fs2").addEventListener("input",render);
document.getElementById("bcsv").addEventListener("click",function(){var fd=gf(),h=["Sehir","Ulke","Mekan","Kategori","Adres","Puan","Yorum"],rows=fd.map(function(r){return[r.city,r.country,r.name,ci(r.cat).l,r.addr,r.rat,r.rev].join(",");});var csv="\uFEFF"+[h.join(",")].concat(rows).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="neyeriz.csv";document.body.appendChild(a);a.click();document.body.removeChild(a);});
fetch("/places.json?t="+Date.now()).then(function(r){return r.json();}).then(function(d){ALL=d;return fetch("/badges.json?t="+Date.now());}).then(function(r){return r.json();}).then(function(d){BADGES=d;buildChips();buildSelects();render();}).catch(function(e){console.error("Veri yuklenemedi:",e);});
</script>
</body>
</html>
