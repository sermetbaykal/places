<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Neyeriz Admin</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;margin:0;padding:20px;min-height:100vh}
.card{background:#222;border-radius:12px;padding:24px;max-width:480px;margin:40px auto}
h2{color:#C9A84C;margin-bottom:4px;font-size:18px}
.sub{color:#666;font-size:12px;margin-bottom:20px}
label{font-size:10px;color:#888;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px;margin-top:12px}
input,select{width:100%;padding:10px;background:#111;border:1px solid #444;border-radius:8px;color:#fff;font-size:13px;margin-bottom:4px;font-family:sans-serif}
button{width:100%;padding:11px;background:#C9A84C;color:#000;border:none;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;margin-top:12px}
.green{background:#1A7A2E;color:#fff}
.outline{background:transparent;color:#C9A84C;border:2px solid #C9A84C;margin-top:6px}
.msg{padding:10px;border-radius:8px;margin-top:8px;font-size:12px;display:none}
.ok{background:#1A7A2E22;border:1px solid #1A7A2E;color:#58C890}
.err{background:#C4391A22;border:1px solid #C4391A;color:#F09080}
.badge-pos{background:#1A7A2E22;color:#58C890;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;display:inline-block}
.badge-neg{background:#C4391A22;color:#F09080;padding:3px 8px;border-radius:4px;font-size:11px;margin:2px;display:inline-block}
.pitem{background:#111;border-radius:8px;padding:10px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.pdel{background:none;border:none;color:#666;cursor:pointer;font-size:18px;width:auto;margin:0;padding:0}
.cats{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;margin-top:6px}
.catbtn{padding:5px 10px;border-radius:20px;font-size:11px;border:1px solid #444;background:transparent;color:#888;cursor:pointer;width:auto;margin:0}
.catbtn.on{border-color:#C9A84C;color:#C9A84C;background:#C9A84C22}
.divider{height:1px;background:#333;margin:16px 0}
.stat-row{display:flex;gap:10px;margin-bottom:4px}
.stat{background:#111;border-radius:8px;padding:10px;flex:1;text-align:center}
.stat-n{font-size:18px;font-weight:700;color:#C9A84C}
.stat-l{font-size:9px;color:#666;letter-spacing:1px;text-transform:uppercase;margin-top:2px}
.topbar{background:#1A1A1A;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;margin:-20px -20px 20px}
.logo{color:#C9A84C;font-weight:700;font-size:16px;letter-spacing:1px}
.cikis{font-size:11px;color:#555;cursor:pointer;padding:4px 10px;border:1px solid #333;border-radius:6px;background:none}
</style>
</head>
<body>

<div id="lock" class="card">
  <h2>Neyeriz Admin</h2>
  <p class="sub">Giris yapmak icin bilgilerinizi girin</p>
  <label>Sifre</label>
  <input type="password" id="pw" placeholder="Sifre">
  <label>GitHub Token</label>
  <input type="password" id="gt" placeholder="ghp_...">
  <label>Google API Key</label>
  <input type="password" id="ak" placeholder="AIzaSy...">
  <label>Claude API Key</label>
  <input type="password" id="ck" placeholder="sk-ant-...">
  <button onclick="giris()">Giris Yap</button>
  <div class="msg err" id="hata">Yanlis sifre</div>
</div>

<div id="app" style="display:none">
  <div class="topbar">
    <span class="logo">NEYERIZ ADMIN</span>
    <span class="cikis" onclick="cikis()">Cikis</span>
  </div>

  <div class="card">
    <div class="stat-row">
      <div class="stat"><div class="stat-n" id="st1">-</div><div class="stat-l">Mekan</div></div>
      <div class="stat"><div class="stat-n" id="st2">-</div><div class="stat-l">Sehir</div></div>
      <div class="stat"><div class="stat-n" id="st3">-</div><div class="stat-l">Ort. Puan</div></div>
    </div>
  </div>

  <div class="card"><h2>Onay Bekleyenler <span id="sug-cnt" style="font-size:13px;color:#C9A84C"></span></h2><div id="sug-list"><div style="font-size:12px;color:#666">Yukleniyor...</div></div><button onclick="loadSuggestions()" style="width:100%;padding:8px;background:transparent;color:#888;border:1px solid #444;border-radius:8px;cursor:pointer;margin-top:8px;font-size:12px">Yenile</button></div>

  <div class="card">
    <h2>Mekan Ekle</h2>
    <label>Google Maps Linki veya Mekan Adi</label>
    <input type="text" id="q" placeholder="Ornek: Nusr-Et Istanbul">
    <button onclick="ara()">Mekan Bilgilerini Cek</button>
    <div id="sonuc" style="display:none;margin-top:14px;padding:14px;background:#111;border-radius:8px">
      <div id="mname" style="font-size:15px;font-weight:700;margin-bottom:4px"></div>
      <div id="mrat" style="color:#C9A84C;font-size:17px;font-weight:800;margin-bottom:3px"></div>
      <div id="maddr" style="font-size:11px;color:#666;margin-bottom:8px"></div>
      <div id="mbadges" style="margin-bottom:10px"></div>
      <label>Kategori</label>
      <div class="cats" id="cats"></div>
      <label>Sehir / Ilce</label>
      <input type="text" id="sehir-txt" placeholder="Ornek: Kadikoy, Amasra, Paris..." style="margin-bottom:4px">
      <label>Ulke</label>
      <input type="text" id="ulke-txt" placeholder="Ornek: Turkiye, Fransa...">
      <label>Sehir</label>
      
      <button class="green" onclick="ekle()" style="margin-top:8px">Listeye Ekle</button>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <h2>Mevcut Mekanlar</h2>
    <input type="text" id="search-existing" placeholder="Mekan ara..." oninput="filterMekanlar()" style="margin-bottom:10px">
    <div id="existing-list" style="max-height:400px;overflow-y:auto"></div>
  </div>

  <div class="card">
    <h2>Bekleyen Mekanlar (<span id="cnt">0</span>)</h2>
    <div id="liste"></div>
    <button class="outline" onclick="yukle()">Siteye Yukle</button>
  </div>
</div>

<script>
var SIFRE = "neyeriz2025";
// Kayitli token'lari yukle
window.onload = function() {
  var sgt = localStorage.getItem("ngt");
  var sak = localStorage.getItem("nak");
  var sck = localStorage.getItem("nck");
  if (sgt) document.getElementById("gt").value = sgt;
  if (sak) document.getElementById("ak").value = sak;
  if (sck) document.getElementById("ck").value = sck;
};
var GT = "", AK = "", CK = "";
var GR = "sermetbaykal/places";
var seciliKat = "", mekan = null;
var bekleyenler = JSON.parse(localStorage.getItem("bk") || "[]");

var KATLAR = [{k:"hamburger",l:"Hamburger"},{k:"steakhouse",l:"Steakhouse"},{k:"italian",l:"Italyan"},{k:"desserts",l:"Tatli"},{k:"coffee",l:"Kahve"},{k:"seafood",l:"Deniz Urunleri"},{k:"cocktail",l:"Kokteyl Bar"},{k:"nightclub",l:"Gece Kulubu"},{k:"traditional",l:"Geleneksel"},{k:"pizza",l:"Pizza"},{k:"kebap",l:"Kebap"},{k:"manti",l:"Manti"},{k:"pide",l:"Pide"},{k:"balik",l:"Balik"},{k:"brunch",l:"Brunch"},{k:"sushi",l:"Sushi"},{k:"vegan",l:"Vegan"},{k:"fastfood",l:"Fast Food"},{k:"fine",l:"Fine Dining"},{k:"bar",l:"Bar"}];

var SEHIRLER = [
  {city:"Paris",country:"Fransa",flag:"FR"},{city:"London",country:"Ingiltere",flag:"GB"},
  {city:"New York",country:"ABD",flag:"US"},{city:"Tokyo",country:"Japonya",flag:"JP"},
  {city:"Dubai",country:"BAE",flag:"AE"},{city:"Barcelona",country:"Ispanya",flag:"ES"},
  {city:"Rome",country:"Italya",flag:"IT"},{city:"Istanbul",country:"Turkiye",flag:"TR"},
  {city:"Singapore",country:"Singapur",flag:"SG"},{city:"Bangkok",country:"Tayland",flag:"TH"},
  {city:"Lisbon",country:"Portekiz",flag:"PT"},{city:"Berlin",country:"Almanya",flag:"DE"},
  {city:"Buenos Aires",country:"Arjantin",flag:"AR"},{city:"Mexico City",country:"Meksika",flag:"MX"},
  {city:"Seoul",country:"Guney Kore",flag:"KR"},{city:"Sydney",country:"Avustralya",flag:"AU"},
  {city:"Miami",country:"ABD",flag:"US"},{city:"Vienna",country:"Avusturya",flag:"AT"},
  {city:"Amsterdam",country:"Hollanda",flag:"NL"},{city:"Cape Town",country:"G.Afrika",flag:"ZA"}
];

function giris() {
  var pw = document.getElementById("pw").value;
  if (pw !== SIFRE) {
    var h = document.getElementById("hata");
    h.style.display = "block";
    setTimeout(function(){ h.style.display = "none"; }, 2000);
    return;
  }
  GT = document.getElementById("gt").value.trim();
  AK = document.getElementById("ak").value.trim();
  CK = document.getElementById("ck").value.trim();
  if (!GT || !AK) { alert("GitHub Token ve Google API Key zorunlu!"); return; }
  localStorage.setItem("ngt", GT);
  localStorage.setItem("nak", AK);
  localStorage.setItem("nck", CK);
  document.getElementById("lock").style.display = "none";
  document.getElementById("app").style.display = "block";
  baslat();
}

function cikis() {
  GT = ""; AK = ""; CK = "";
  document.getElementById("app").style.display = "none";
  document.getElementById("lock").style.display = "block";
  document.getElementById("pw").value = "";
  document.getElementById("gt").value = "";
  document.getElementById("ak").value = "";
  document.getElementById("ck").value = "";
}

function baslat() {
  var ch = document.getElementById("cats");
  ch.innerHTML = "";
  KATLAR.forEach(function(k) {
    var b = document.createElement("button");
    b.className = "catbtn"; b.textContent = k.l; b.dataset.k = k.k;
    b.onclick = function() {
      document.querySelectorAll(".catbtn").forEach(function(x){ x.classList.remove("on"); });
      b.classList.add("on"); seciliKat = k.k;
    };
    ch.appendChild(b);
  });
  // Sehir dropdown kaldirildi
  istatistik();
  listele();
  loadSuggestions();
  loadMekanlar();
}

async function istatistik() {
  try {
    var r = await fetch("https://raw.githubusercontent.com/sermetbaykal/places/main/places.json?t="+Date.now());
    var data = await r.json();
    document.getElementById("st1").textContent = data.length;
    document.getElementById("st2").textContent = new Set(data.map(function(d){return d.city;})).size;
    var avg = data.reduce(function(s,d){return s+d.rat;},0)/data.length;
    document.getElementById("st3").textContent = avg.toFixed(2);
  } catch(e) { console.log("istatistik hata:", e); }
}

async function ara() {
  var q = document.getElementById("q").value.trim();
  if (!q) { mesaj("Mekan adi girin", "err"); return; }
  var btn = event.target;
  btn.textContent = "Cekiliyor..."; btn.disabled = true;
  document.getElementById("sonuc").style.display = "none";
  try {
    var r = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method: "POST",
      headers: {"Content-Type":"application/json","X-Goog-Api-Key":AK,"X-Goog-FieldMask":"places.id,places.displayName,places.rating,places.userRatingCount,places.formattedAddress,places.addressComponents"},
      body: JSON.stringify({textQuery:q,maxResultCount:1,languageCode:"en"})
    });
    var d = await r.json();
    if (d.places && d.places.length) {
      var p = d.places[0];
      if(p.rating) mekan.rat = p.rating;
      if(p.userRatingCount) mekan.rev = p.userRatingCount;
      var comps = p.addressComponents || [];
      var district="",city="",country="",countryCode="";
      comps.forEach(function(c){
        if(c.types.indexOf("administrative_area_level_2")>=0) district=c.longText;
        else if(c.types.indexOf("administrative_area_level_1")>=0) city=c.longText;
        else if(c.types.indexOf("country")>=0){country=c.longText;countryCode=c.shortText;}
      });
      var displayCity = district || city || "";
      var flag = countryCode ? countryCode.split("").map(function(c){return String.fromCodePoint(c.charCodeAt(0)+127397);}).join("") : "🌍";
      if(document.getElementById("sehir-txt")) document.getElementById("sehir-txt").value = displayCity;
      if(document.getElementById("ulke-txt")) document.getElementById("ulke-txt").value = country;
      mekan = {place_id:p.id||"",name:p.displayName?p.displayName.text:"",addr:p.formattedAddress||"",rat:p.rating||0,rev:p.userRatingCount||p.ratingCount||0,badges:{positive:[],negative:[]},city:displayCity,country:country,flag:flag};
      document.getElementById("mname").textContent = mekan.name;
      document.getElementById("mrat").textContent = mekan.rat.toFixed(1)+"★ · "+mekan.rev.toLocaleString("tr-TR")+" yorum";
      document.getElementById("maddr").textContent = mekan.addr;
      document.getElementById("mbadges").innerHTML = '<span style="color:#666;font-size:11px">AI analiz yapiliyor...</span>';
      document.getElementById("sonuc").style.display = "block";
      // Reviews icin ayri API cagrisi
      var reviews = "";
      try {
        var rr = await fetch("https://places.googleapis.com/v1/places:searchText", {
          method:"POST",
          headers:{"Content-Type":"application/json","X-Goog-Api-Key":AK,"X-Goog-FieldMask":"places.reviews"},
          body:JSON.stringify({textQuery:document.getElementById("q").value,maxResultCount:1,languageCode:"en"})
        });
        var rd = await rr.json();
        if(rd.places && rd.places.length) {
          reviews = (rd.places[0].reviews||[]).map(function(rv){return rv.text?rv.text.text:"";}).join(" ").slice(0,800);
        }
      } catch(e) {}
      if (reviews && CK) {
        var badges = await badgeAl(reviews);
        mekan.badges = badges;
        var bh = "";
        (badges.positive||[]).forEach(function(b){bh+='<span class="badge-pos">+ '+b+'</span>';});
        (badges.negative||[]).forEach(function(b){bh+='<span class="badge-neg">! '+b+'</span>';});
        document.getElementById("mbadges").innerHTML = bh || "";
      } else {
        document.getElementById("mbadges").innerHTML = "";
      }
    } else { mesaj("Mekan bulunamadi", "err"); }
  } catch(e) { mesaj("Hata: "+e.message, "err"); }
  btn.textContent = "Mekan Bilgilerini Cek"; btn.disabled = false;
}

async function badgeAl(reviewText) {
  try {
    var r = await fetch("https://neyeriz-proxy.sermetbaykal.workers.dev", {
      method: "POST",
      headers: {"Content-Type":"application/json","x-api-key":CK,"anthropic-version":"2023-06-01"},
      body: JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:150,messages:[{role:"user",content:'Restoran yorumlarindan Turkce badge cikar. SADECE JSON: {"positive":[],"negative":[]} Maks 3 pozitif 2 negatif. Max 3 kelime. Yorumlar: '+reviewText}]})
    });
    var d = await r.json();
    var text = d.content[0].text.trim().replace(/```json|```/g,"").trim();
    return JSON.parse(text);
  } catch(e) { return {positive:[],negative:[]}; }
}

function ekle() {
  if (!mekan) { mesaj("Once mekan cek","err"); return; }
  if (!seciliKat) { mesaj("Kategori sec","err"); return; }
  var sehirEl = document.getElementById("sehir-txt");
  var ulkeEl = document.getElementById("ulke-txt");
  var sv = (sehirEl && sehirEl.value.trim()) ? sehirEl.value.trim() : (mekan.city || "");
  var ulke = (ulkeEl && ulkeEl.value.trim()) ? ulkeEl.value.trim() : (mekan.country || sv);
  var flag = mekan.flag || "\uD83C\uDF0D";
  var kayit = Object.assign({},mekan,{cat:seciliKat,cat_label:KATLAR.find(function(k){return k.k===seciliKat;}).l,city:sv,country:ulke,flag:flag});
  bekleyenler.push(kayit);
  localStorage.setItem("bk",JSON.stringify(bekleyenler));
  document.getElementById("sonuc").style.display = "none";
  document.getElementById("q").value = "";
  mekan = null; seciliKat = "";
  document.querySelectorAll(".catbtn").forEach(function(x){x.classList.remove("on");});
  mesaj("✓ "+kayit.name+" eklendi!","ok");
  listele();
}

var mekanlarData = [];

async function loadMekanlar() {
  try {
    var r = await fetch("https://raw.githubusercontent.com/sermetbaykal/places/main/places.json?t="+Date.now());
    mekanlarData = await r.json();
    filterMekanlar();
  } catch(e) { console.log("Mekanlar yuklenemedi:", e); }
}

function filterMekanlar() {
  var q = document.getElementById("search-existing").value.toLowerCase();
  var filtered = mekanlarData.filter(function(m){ return (m.name+m.city+m.cat_label).toLowerCase().includes(q); });
  var el = document.getElementById("existing-list");
  if (!filtered.length) { el.innerHTML = "<div style='color:#666;font-size:12px;padding:10px'>Mekan bulunamadi</div>"; return; }
  el.innerHTML = filtered.slice(0,50).map(function(m,i){
    var realIdx = mekanlarData.indexOf(m);
    return "<div style='background:#111;border-radius:8px;padding:9px 11px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center'>"+
      "<div><div style='font-size:12px;font-weight:600'>"+m.name+"</div><div style='font-size:10px;color:#666;margin-top:1px'>"+m.city+" · "+(m.cat_label||m.cat)+"</div></div>"+
      "<div style='display:flex;gap:6px'>"+
      "<button onclick='openEdit("+realIdx+")' style='padding:4px 8px;background:#C9A84C22;color:#C9A84C;border:1px solid #C9A84C44;border-radius:6px;cursor:pointer;font-size:11px'>Duzenle</button>"+
      "<button onclick='silMekan("+realIdx+")' style='padding:4px 8px;background:#C4391A22;color:#F09080;border:1px solid #C4391A44;border-radius:6px;cursor:pointer;font-size:11px'>Sil</button>"+
      "</div></div>";
  }).join("");
}

var currentEditBadges = {positive:[], negative:[]};
var currentBadgesData = {};

async function openEdit(idx) {
  var m = mekanlarData[idx];
  document.getElementById("edit-name").value = m.name;
  document.getElementById("edit-addr").value = m.addr || "";
  document.getElementById("edit-idx").value = idx;
  var catSel = document.getElementById("edit-cat");
  catSel.innerHTML = KATLAR.map(function(k){ return "<option value='"+k.k+"'"+(k.k===m.cat?" selected":"")+">"+k.l+"</option>"; }).join("");
  var citySel = document.getElementById("edit-city");
  citySel.innerHTML = SEHIRLER.map(function(s){ return "<option value='"+s.city+"'"+(s.city===m.city?" selected":"")+">"+s.city+"</option>"; }).join("");
  document.getElementById("edit-place-id").value = m.place_id || "";
  try {
    var rb = await fetch("https://raw.githubusercontent.com/sermetbaykal/places/main/badges.json?t="+Date.now());
    currentBadgesData = await rb.json();
    currentEditBadges = currentBadgesData[m.place_id||""] || {positive:[], negative:[]};
  } catch(e) { currentEditBadges = {positive:[], negative:[]}; }
  renderEditBadges();
  var modal = document.getElementById("edit-modal");
  modal.style.display = "flex";
}

function renderEditBadges() {
  var posEl = document.getElementById("edit-pos-badges");
  var negEl = document.getElementById("edit-neg-badges");
  posEl.innerHTML = (currentEditBadges.positive||[]).map(function(b,i){
    return '<span style="background:#1A7A2E22;color:#58C890;border:1px solid #1A7A2E44;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer" onclick="removeBadge(\'pos\','+i+')">'+b+' x</span>';
  }).join("");
  negEl.innerHTML = (currentEditBadges.negative||[]).map(function(b,i){
    return '<span style="background:#C4391A22;color:#F09080;border:1px solid #C4391A44;padding:3px 8px;border-radius:4px;font-size:11px;cursor:pointer" onclick="removeBadge(\'neg\','+i+')">'+b+' x</span>';
  }).join("");
}

function addBadge(type) {
  var inp = document.getElementById(type==="pos"?"new-pos-badge":"new-neg-badge");
  var val = inp.value.trim();
  if (!val) return;
  if (type==="pos") currentEditBadges.positive.push(val);
  else currentEditBadges.negative.push(val);
  inp.value = "";
  renderEditBadges();
}

function removeBadge(type, idx) {
  if (type==="pos") currentEditBadges.positive.splice(idx,1);
  else currentEditBadges.negative.splice(idx,1);
  renderEditBadges();
}

async function badgeYenile() {
  var name = document.getElementById("edit-name").value;
  var btn = document.getElementById("btn-badge-refresh");
  btn.textContent = "Analiz yapiliyor..."; btn.disabled = true;
  try {
    var r = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":AK,"X-Goog-FieldMask":"places.reviews"},
      body:JSON.stringify({textQuery:name,maxResultCount:1,languageCode:"en"})
    });
    var d = await r.json();
    if (d.places && d.places.length) {
      var reviews = (d.places[0].reviews||[]).map(function(rv){return rv.text?rv.text.text:"";}).join(" ").slice(0,800);
      if (reviews && CK) {
        var badges = await badgeAl(reviews);
        currentEditBadges = badges;
        renderEditBadges();
      }
    }
  } catch(e) { mesaj("Badge hatasi: "+e.message,"err"); }
  btn.textContent = "AI ile Yenile"; btn.disabled = false;
}

function closeEdit() {
  document.getElementById("edit-modal").style.display = "none";
}

async function saveEdit() {
  var idx = parseInt(document.getElementById("edit-idx").value);
  var catKey = document.getElementById("edit-cat").value;
  var cityVal = document.getElementById("edit-city").value;
  var so = SEHIRLER.find(function(s){return s.city===cityVal;})||{flag:"",country:""};
  mekanlarData[idx].name = document.getElementById("edit-name").value;
  mekanlarData[idx].addr = document.getElementById("edit-addr").value;
  mekanlarData[idx].cat = catKey;
  mekanlarData[idx].cat_label = KATLAR.find(function(k){return k.k===catKey;}).l;
  mekanlarData[idx].city = cityVal;
  mekanlarData[idx].country = so.country;
  mekanlarData[idx].flag = so.flag;
  var pid = document.getElementById("edit-place-id").value;
  if (pid) currentBadgesData[pid] = currentEditBadges;
  closeEdit();
  await saveToGithub();
  await saveBadgesToGithub();
  filterMekanlar();
  mesaj("Mekan guncellendi!","ok");
}

async function saveBadgesToGithub() {
  try {
    var r = await fetch("https://api.github.com/repos/"+GR+"/contents/badges.json",{headers:{"Authorization":"token "+GT}});
    var fd = await r.json();
    var enc = btoa(unescape(encodeURIComponent(JSON.stringify(currentBadgesData))));
    await fetch("https://api.github.com/repos/"+GR+"/contents/badges.json",{
      method:"PUT",
      headers:{"Authorization":"token "+GT,"Content-Type":"application/json"},

async function yukle() {
  if (!bekleyenler.length) { mesaj("Eklenecek mekan yok","err"); return; }
  var btn = event.target; btn.textContent = "Yukleniyor..."; btn.disabled = true;
  try {
    // Mevcut places.json'u cek
    var r1 = await fetch("https://api.github.com/repos/"+GR+"/contents/places.json",{headers:{"Authorization":"token "+GT}});
    var f1 = await r1.json();
    var raw1 = atob(f1.content.replace(/\n/g,""));
    var bytes1 = new Uint8Array(raw1.length);
    for(var i=0;i<raw1.length;i++) bytes1[i]=raw1.charCodeAt(i);
    var places = JSON.parse(new TextDecoder("utf-8").decode(bytes1));
    
    // Mevcut badges.json'u cek
    var r2 = await fetch("https://api.github.com/repos/"+GR+"/contents/badges.json",{headers:{"Authorization":"token "+GT}});
    var f2 = await r2.json();
    var raw2 = atob(f2.content.replace(/\n/g,""));
    var bytes2 = new Uint8Array(raw2.length);
    for(var i=0;i<raw2.length;i++) bytes2[i]=raw2.charCodeAt(i);
    var badges = JSON.parse(new TextDecoder("utf-8").decode(bytes2));
    
    // Yeni mekanları ekle
    var temiz = bekleyenler.map(function(p){ var r=Object.assign({},p); delete r.badges; return r; });
    bekleyenler.forEach(function(p){ if(p.badges&&p.place_id){ badges[p.place_id]=p.badges; } });
    var nd = places.concat(temiz);
    
    // places.json guncelle
    var enc1 = btoa(unescape(encodeURIComponent(JSON.stringify(nd,null,0))));
    var rsp1 = await fetch("https://api.github.com/repos/"+GR+"/contents/places.json",{
      method:"PUT",
      headers:{"Authorization":"token "+GT,"Content-Type":"application/json"},
      body:JSON.stringify({message:"add "+temiz.length+" places",sha:f1.sha,content:enc1})
    });
    var rs1 = await rsp1.json();
    if (!rs1.content) { mesaj("Hata places.json: "+JSON.stringify(rs1),"err"); btn.disabled=false; btn.textContent="Siteye Yukle"; return; }
    
    // badges.json guncelle
    var enc2 = btoa(unescape(encodeURIComponent(JSON.stringify(badges,null,0))));
    var rsp2 = await fetch("https://api.github.com/repos/"+GR+"/contents/badges.json",{
      method:"PUT",
      headers:{"Authorization":"token "+GT,"Content-Type":"application/json"},
      body:JSON.stringify({message:"update badges",sha:f2.sha,content:enc2})
    });
    var rs2 = await rsp2.json();
    if (!rs2.content) { mesaj("Hata badges.json: "+JSON.stringify(rs2),"err"); btn.disabled=false; btn.textContent="Siteye Yukle"; return; }
    
    bekleyenler = []; localStorage.setItem("bk","[]"); listele();
    mesaj("Yuklendi! Sitede "+nd.length+" mekan var.","ok");
    istatistik();
  } catch(e) { mesaj("Hata: "+e.message,"err"); }
  btn.textContent = "Siteye Yukle"; btn.disabled = false;
}

async function yukle_OLD() {
  if (!bekleyenler.length) { mesaj("Eklenecek mekan yok","err"); return; }
  var btn = event.target; btn.textContent = "Yukleniyor..."; btn.disabled = true;
  try {
    var r = await fetch("https://api.github.com/repos/"+GR+"/contents/index.html",{headers:{"Authorization":"token "+GT}});
    var fd = await r.json(); var sha = fd.sha;
    var raw = fd.content.replace(/\n/g,"");
    var binary = atob(raw);
    var bytes = new Uint8Array(binary.length);
    for(var i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
    var cur = new TextDecoder("utf-8").decode(bytes);
    
    var allStart = cur.indexOf("var ALL=[");
    var allEnd = cur.indexOf("];", allStart) + 2;
    var badgesStart = cur.indexOf("var BADGES={");
    var badgesEnd = cur.indexOf("};", badgesStart) + 2;
    
    if (allStart < 0) { mesaj("Veri bulunamadi","err"); btn.disabled=false; btn.textContent="Siteye Yukle"; return; }
    
    // Bracket sayarak dogru JSON sonunu bul
    var depth=0, end=-1;
    for(var ii=allStart+8; ii<cur.length; ii++){
      if(cur[ii]==='[') depth++;
      else if(cur[ii]===']'){ depth--; if(depth===0){end=ii;break;} }
    }
    var existingData = JSON.parse(cur.slice(allStart+8, end+1));
    var eb = {};
    if (badgesStart > 0) { 
      try { 
        var bd=0, bend=-1;
        for(var ii=badgesStart+11; ii<cur.length; ii++){
          if(cur[ii]==='{') bd++;
          else if(cur[ii]==='}'){bd--;if(bd===0){bend=ii;break;}}
        }
        eb = JSON.parse(cur.slice(badgesStart+11, bend+1)); 
      } catch(e) {} 
    }
    
    bekleyenler.forEach(function(p){ if(p.badges&&p.place_id){ eb[p.place_id]=p.badges; } });
    var temiz = bekleyenler.map(function(p){ var r=Object.assign({},p); delete r.badges; return r; });
    var nd = existingData.concat(temiz);
    
    var nh = cur.slice(0, allStart+8) + JSON.stringify(nd) + cur.slice(end+1);
    if (badgesStart > 0) {
      var newBadgesStart = nh.indexOf("var BADGES={");
      var newBadgesEnd = nh.indexOf("};", newBadgesStart) + 2;
      nh = nh.slice(0, newBadgesStart) + "var BADGES=" + JSON.stringify(eb) + ";" + nh.slice(newBadgesEnd);
    }
    
    var enc = btoa(unescape(encodeURIComponent(nh)));
    var rsp = await fetch("https://api.github.com/repos/"+GR+"/contents/index.html",{method:"PUT",headers:{"Authorization":"token "+GT,"Content-Type":"application/json"},body:JSON.stringify({message:"add "+bekleyenler.length+" places",sha:sha,content:enc})});
    var rs = await rsp.json();
    if (rs.content) {
      bekleyenler = []; localStorage.setItem("bk","[]"); listele();
      mesaj("✓ Yuklendi! Sitede "+nd.length+" mekan var.","ok");
      istatistik();
    } else { mesaj("Hata: "+JSON.stringify(rs),"err"); }
  } catch(e) { mesaj("Hata: "+e.message,"err"); }
  btn.textContent = "Siteye Yukle"; btn.disabled = false;
}



async function loadSuggestions() {
  var el = document.getElementById("sug-list");
  var cnt = document.getElementById("sug-cnt");
  if(!el) return;
  el.innerHTML = "<div style=\"font-size:12px;color:#666\">Yukleniyor...</div>";
  try {
    var resp = await fetch("https://neyeriz-proxy.sermetbaykal.workers.dev/suggestions");
    var items = await resp.json();
    items = items.filter(function(i){ return i && i.status; });
    var pending = items.filter(function(i){ return i.status === "pending"; });
    cnt.textContent = pending.length ? "(" + pending.length + ")" : "";
    if (!pending.length) {
      el.innerHTML = "<div style=\"font-size:12px;color:#666\">Onay bekleyen oneri yok</div>";
      return;
    }
    var out = "";
    pending.sort(function(a,b){ return b.ts.localeCompare(a.ts); }).forEach(function(item) {
      var safe = encodeURIComponent(JSON.stringify(item));
      out += "<div style=\"background:#111;border-radius:8px;padding:10px;margin-bottom:6px\">";
      out += "<div style=\"font-size:12px;font-weight:600;margin-bottom:3px\">" + item.name + "</div>";
      out += "<div style=\"font-size:10px;color:#888;margin-bottom:6px\">" + item.addr + " - " + item.rat.toFixed(1) + " yildiz</div>";
      out += "<div style=\"display:flex;gap:6px\">";
      out += "<button data-item=\"" + safe + "\" onclick=\"approveSug(this)\" style=\"flex:1;padding:5px;background:#1A7A2E;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:11px\">Onayla</button>";
      out += "<button data-id=\"" + item.id + "\" onclick=\"rejectSug(this)\" style=\"flex:1;padding:5px;background:transparent;color:#F09080;border:1px solid #C4391A;border-radius:6px;cursor:pointer;font-size:11px\">Reddet</button>";
      out += "</div></div>";
    });
    el.innerHTML = out;
  } catch(e) {
    el.innerHTML = "<div style=\"font-size:12px;color:#F09080\">Hata: " + e.message + "</div>";
  }
}

async function approveSug(btn) {
  var item = JSON.parse(decodeURIComponent(btn.getAttribute("data-item")));
  mekan = {place_id:item.place_id||"",name:item.name,addr:item.addr,rat:item.rat,rev:item.rev||0,badges:{positive:[],negative:[]},city:"",country:"",flag:"🌍"};
  document.getElementById("q").value = item.name;
  document.getElementById("mname").textContent = item.name;
  document.getElementById("mrat").textContent = item.rat.toFixed(1) + " yildiz";
  document.getElementById("maddr").textContent = item.addr;
  document.getElementById("mbadges").innerHTML = "Analiz yapiliyor...";
  document.getElementById("sonuc").style.display = "block";
  try {
    var pr = await fetch("https://places.googleapis.com/v1/places:searchText", {
      method:"POST",
      headers:{"Content-Type":"application/json","X-Goog-Api-Key":AK,"X-Goog-FieldMask":"places.addressComponents,places.rating,places.userRatingCount"},
      body:JSON.stringify({textQuery:item.name,maxResultCount:1,languageCode:"en"})
    });
    var pd = await pr.json();
    if(pd.places && pd.places.length) {
      var p = pd.places[0];
      var comps = p.addressComponents || [];
      var district="",city="",country="",countryCode="";
      comps.forEach(function(c){
        if(c.types.indexOf("administrative_area_level_2")>=0) district=c.longText;
        else if(c.types.indexOf("administrative_area_level_1")>=0) city=c.longText;
        else if(c.types.indexOf("country")>=0){country=c.longText;countryCode=c.shortText;}
      });
      var displayCity = district || city || "";
      var flag = "🌍";
      if(countryCode) { try { flag = countryCode.split("").map(function(ch){return String.fromCodePoint(ch.charCodeAt(0)+127397);}).join(""); } catch(e){} }
      mekan.city = displayCity; mekan.country = country; mekan.flag = flag;
      if(document.getElementById("sehir-txt")) document.getElementById("sehir-txt").value = displayCity;
      if(document.getElementById("ulke-txt")) document.getElementById("ulke-txt").value = country;
      // Reviews icin ayri cagri
      var reviews = "";
      try {
        var rr2 = await fetch("https://places.googleapis.com/v1/places:searchText", {
          method:"POST",
          headers:{"Content-Type":"application/json","X-Goog-Api-Key":AK,"X-Goog-FieldMask":"places.reviews"},
          body:JSON.stringify({textQuery:item.name,maxResultCount:1,languageCode:"en"})
        });
        var rd2 = await rr2.json();
        if(rd2.places && rd2.places.length) {
          reviews = (rd2.places[0].reviews||[]).map(function(rv){return rv.text?rv.text.text:"";}).join(" ").slice(0,800);
        }
      } catch(e) {}
      if(reviews && CK) {
        var badges = await badgeAl(reviews);
        mekan.badges = badges;
        var bh = "";
        (badges.positive||[]).forEach(function(b){bh+="<span class=\"rbdg rbdg-pos\">+ "+b+"</span>";});
        (badges.negative||[]).forEach(function(b){bh+="<span class=\"rbdg rbdg-neg\">! "+b+"</span>";});
        document.getElementById("mbadges").innerHTML = bh || "";
      } else { document.getElementById("mbadges").innerHTML = ""; }
    }
  } catch(e) { document.getElementById("mbadges").innerHTML = ""; }
  await rejectSugById(item.id);
  mesaj("Onaylandi! Kategori sec ve listeye ekle.", "ok");
}

async function rejectSug(btn) {
  await rejectSugById(btn.getAttribute("data-id"));
}

async function rejectSugById(id) {
  try {
    await fetch("https://neyeriz-proxy.sermetbaykal.workers.dev/suggestions/" + id, {method: "DELETE"});
    loadSuggestions();
  } catch(e) {}
}

  var e = document.getElementById("msg");
  e.textContent = t; e.className = "msg "+c; e.style.display = "block";
  setTimeout(function(){ e.style.display = "none"; },4000);
